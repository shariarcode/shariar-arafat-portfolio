name: Keep Supabase Alive

on:
  schedule:
    # Runs at 12:00 PM UTC every Monday and Thursday (twice a week)
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Allows manual triggering from the Actions tab on GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS --fail-with-body "${SUPABASE_URL}/rest/v1/settings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
